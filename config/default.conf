# Logging: nginx writes its access and error log to stdout/stderr (docker logs), rotated by the
# json-file logging options of the compose file (10 MB x 3 files).
# Behind a tunnel or reverse proxy the access log only shows the address of the proxy container as the
# client (no real_ip module is configured on purpose), so visitor IPs are not recorded by this server.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name finplanr.net www.finplanr.net;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;
    # Redirects (/de -> /de/) are relative, so they keep https behind a TLS-terminating tunnel or proxy (nginx itself only sees http).
    absolute_redirect off;

    # Compress text assets (text/html is always compressed once gzip is on).
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Never serve hidden files or accidental editor/backup/config files.
    location ~ /\.(?!well-known) { deny all; }
    location ~* \.(?:bak|old|orig|swp|tmp|log|env|yaml|yml)$ { deny all; }

    # Static assets: one week of browser caching. `expires` is used instead of add_header on purpose: add_header inside a
    # location block would drop the server-level security headers above. Placed after the deny rules (first regex match wins).
    location ~* ^/(?:logos/|.+\.(?:svg|png|jpg|jpeg|ico)$) {
        expires 7d;
    }
}
