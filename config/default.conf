# Logging (privacy by design): the access log is deliberately free of personal data. It records only time, method,
# path (without query string), status and response size: no client address, no X-Forwarded-For, no referrer, no user agent.
# Behind a tunnel or reverse proxy the proxy passes the visitor's address in request headers; because the format below
# does not use any of them (and no real_ip module is configured on purpose), visitor IPs are never written by this server.
# nginx writes the access log to stdout and the error log to stderr (docker logs); the container runtime rotates them by size
# (compose file: 10 MB x 3 files). The error log is nginx's built-in one and is kept at its default: its lines can contain
# the address of the connecting client, which behind the tunnel or proxy is the proxy container's internal address, not the visitor.
#
# This file is loaded by the stock nginx image from /etc/nginx/conf.d/*.conf, which is included inside the http block,
# so log_format (allowed in the http context only) can be defined at the top level of this file. access_log is set inside the
# server block on purpose: the stock nginx.conf already defines an http-level access_log with its default "main" format
# (which contains the client address and X-Forwarded-For); a directive at the same http level would be added to it instead of
# replacing it, whereas one at server level replaces the inherited one, so only the IP-free format below is written.
log_format finplanr '$time_iso8601 $request_method $uri $status $body_bytes_sent';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name finplanr.net www.finplanr.net;
    root /usr/share/nginx/html;
    index index.html;
    autoindex off;
    server_tokens off;
    access_log /dev/stdout finplanr;
    # Scanner requests for missing files must not fill the error log with client addresses.
    log_not_found off;
    # Redirects (/de -> /de/) are relative, so they keep https behind a TLS-terminating tunnel or proxy (nginx itself only sees http).
    absolute_redirect off;

    # Compress text assets (text/html is always compressed once gzip is on).
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ---- Allowlist: only the public file types below can ever be served; everything else answers 404 --------------------
    # Whatever ends up in the served folder by accident (backups, dotfiles, archives, scripts, config, notes, editor or
    # download leftovers) has no matching rule below and gets 404, even if the file exists. 404 rather than 403, so the
    # answer does not confirm that a file exists. Request paths are decoded and normalised by nginx before matching
    # (%2e, //, /../), so encoded or dotted variants end up in the same rules.
    # Matching order: exact (=), then ^~ prefix, then the regex locations in file order (first match wins), then the
    # longest plain prefix. Keep the order of the blocks. No add_header in any location (it would drop the security headers
    # above); `expires` is used for caching.

    # 1. Instrument index (written by the updater into a read-only folder): exactly one file, cached for one hour. The
    #    ^~ prefix below stops the regex rules from matching anything else under /data/ (status file, temp files, ...).
    location = /data/instruments.v1.json {
        expires 1h;
    }
    location ^~ /data/ {
        return 404;
    }

    # 2. Plain-text files: robots.txt only.
    location = /robots.txt {
    }

    # 3. Images and icons: lower-case names (letters, digits, - and _) in folders of the same kind; one week of caching.
    location ~ ^/(?:[a-z0-9_-]+/)*[a-z0-9_-]+\.(?:svg|png|jpg|jpeg|webp|ico)$ {
        expires 7d;
    }

    # 4. Pages, styles, sitemap: same name rule. Folder names cannot contain a dot, so "archive.zip/index.html" is no match.
    location ~ ^/(?:[a-z0-9_-]+/)*[a-z0-9_-]+\.(?:html|css|xml)$ {
    }

    # 5. Everything else whose path contains a dot anywhere (dotfiles, .git/, .env*, backups, archives, scripts, markdown,
    #    config, "name.html:Zone.Identifier", "file.txt~", "/index.html/.env", upper-case variants, trailing-slash tricks).
    #    No exception for /.well-known/: the site has no such files.
    location ~ \. {
        return 404;
    }

    # 6. Remaining paths contain no dot. Folder URLs (/, /de/, /en/) serve the folder's index.html; a folder without index
    #    file answers 404 (autoindex is off), not 403.
    location ~ /$ {
        try_files ${uri}index.html =404;
    }

    # 7. Other dot-free paths (/de, /logos, LICENSE, ...): only a folder is accepted, and it is redirected to the slash form
    #    (relative redirect, see absolute_redirect). A dot-free path that is a file is not a folder, so it gets 404.
    location / {
        try_files $uri/ =404;
    }
    error_page 403 =404 @notfound;
    location @notfound {
        return 404;
    }
}
